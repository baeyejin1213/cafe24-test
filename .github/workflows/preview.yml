name: 기획전 미리보기

# promo/* 브랜치에 코드가 올라오면
# 1) 피그마 이미지를 받아 그 브랜치에 커밋하고 (저장소 Secret FIGMA_TOKEN 필요)
# 2) 카페24 없이 열리는 미리보기를 만들어 previews 브랜치에 올립니다.
#    예약 작업이 previews 브랜치의 결과를 Claude 아티팩트로 올려 보드에 링크를 붙입니다.

on:
  push:
    branches: ["promo/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-publish
  cancel-in-progress: false

env:
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 도구 설치
        run: npm install --prefix tools --no-audit --no-fund

      - name: 피그마 이미지 받기
        if: env.FIGMA_TOKEN != ''
        run: |
          for d in promotions/*/; do
            [ -f "$d/images.json" ] || continue
            node tools/figma-export.mjs "$d" || echo "::warning::$d 이미지 일부를 받지 못했어요"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promotions/*/images 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "피그마 이미지 받기"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 토큰 없음 안내
        if: env.FIGMA_TOKEN == ''
        run: echo "::warning::FIGMA_TOKEN Secret이 없어 이미지 없이 미리보기를 만듭니다."

      - name: 미리보기 만들기
        run: |
          export SOURCE_SHA=$(git rev-parse HEAD)
          rm -rf _preview && mkdir _preview
          for d in promotions/*/; do
            ls "$d"/project.html "$d"/pc.html "$d"/mo.html >/dev/null 2>&1 || continue
            node tools/build-preview.mjs "$d" "_preview/$(basename "$d")" --self-contained
          done

      - name: previews 브랜치에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf ../pv
            if git ls-remote --exit-code --heads origin previews >/dev/null; then
              git fetch --depth 1 origin previews
              git worktree add -f ../pv FETCH_HEAD
              (cd ../pv && git checkout -B previews)
            else
              git worktree add -f --detach ../pv
              (cd ../pv && git checkout --orphan previews && git rm -rfq . && printf '# 기획전 미리보기\n\n기획전 폴더별 미리보기 빌드 결과입니다. GitHub Actions가 자동으로 올립니다.\n' > README.md)
            fi
            for f in _preview/*/; do
              n=$(basename "$f"); rm -rf "../pv/$n"; cp -r "$f" "../pv/$n"
            done
            (cd ../pv && git add -A && (git diff --cached --quiet || git commit -m "미리보기: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}") && git push origin previews) && break
            git worktree remove -f ../pv || true
            sleep 5
          done
